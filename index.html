<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6558f5" />
    <meta
      name="description"
      content="おおもじと こもじを、きいて、えらんで、かいて おぼえる ゲームです。"
    />
    <title>アルファベット たんけんたい</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky-decoration sky-decoration--one" aria-hidden="true"></div>
    <div class="sky-decoration sky-decoration--two" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="topbar">
        <button id="backButton" class="icon-button" type="button" aria-label="もどる" hidden>
          <span aria-hidden="true">←</span>
        </button>

        <button id="brandButton" class="brand-button" type="button" aria-label="おうちへ もどる">
          <span class="brand-mark" aria-hidden="true">Aa</span>
          <span class="brand-name">たんけんたい</span>
        </button>

        <button id="soundButton" class="sound-button" type="button" aria-pressed="true">
          <span id="soundIcon" aria-hidden="true">🔊</span>
          <span id="soundLabel">おと あり</span>
        </button>
      </header>

      <main id="app" tabindex="-1">
        <section class="screen loading-screen">
          <div class="loading-star" aria-hidden="true">★</div>
          <p>よみこみちゅう...</p>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="celebration" class="celebration" aria-hidden="true"></div>

    <script src="app.js" defer></script>
  </body>
</html>
